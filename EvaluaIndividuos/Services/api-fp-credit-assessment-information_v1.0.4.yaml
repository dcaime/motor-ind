# ══════════════════════════════════════════════════════════════════════
  responses:
    badRequest:
      description: "Solicitud inválida — parámetros incorrectos o faltantes."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    unauthorized:
      description: "No autorizado — token inválido o expirado."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    notFound:
      description: "Recurso no encontrado."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    tooManyRequests:
      description: "Demasiadas solicitudes — límite de rate excedido."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    internalServerError:
      description: "Error interno del servidor."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    badGateway:
      description: "Error de gateway — el backend no respondió correctamente."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    serviceUnavailable:
      description: "Servicio no disponible temporalmente."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    gatewayTimeout:
      description: "Timeout del gateway — el backend no respondió a tiempo."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

