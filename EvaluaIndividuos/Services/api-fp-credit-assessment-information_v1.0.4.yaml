openapi: 3.0.0
info:
  title: FP-Credit-Assessment-Information
  description: API de consulta al bureau crediticio el perfil crediticio completo de una persona física.
  version: 1.0.4
  x-ns: bureaus
  x-ns-path: /v1/credit-assessment-information
  x-security-type: access

servers:
  - url: /v1/fp/credit-assessment-information

security:
  - bearerAuth: []

tags:
  - name: FP-Credit-Assessment-Information
    description: Consulta de evaluación crediticia 

paths:
# ------------------------------------------------------------------
# GET - Consulta de evaluación crediticia (Bureau Assessment)
# ------------------------------------------------------------------
  /retrieve/siisa:
    get:
      tags:
        - FP-Credit-Assessment-Information
      summary: Obtiene la evaluación crediticia de una persona por SIISA
      description: Consulta el perfil crediticio completo de una persona física en el bureau SIISA, incluyendo historial de morosidades, cheques BCRA, scoring y variables sumarizadas.
      operationId: get-retrieve-siisa
      parameters:
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
            format: uuid
            nullable: true
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89ABab][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
            example: "e7c9d173-64c2-4b1b-91f3-8c6d8a8e7d9c"
          description: Identificador único de la transacción (UUIDv4)  
        - name: apikey
          in: header
          required: true
          schema:
            type: string
            example: "abc123def456"
          description: API Key de autenticación del consumidor.
        - name: taxpayer-number
          in: query
          required: false
          schema:
            type: string
            nullable: true
            pattern: '^(|(20|23|24|25|26|27|30|33|34)\d{9})$'
          examples: 
            200-OK: 
              value: "20123456780"
            409-ERR: 
              value: "20123456790"
          description: CUIL de la persona a consultar sin guiones. Enviar vacío si la consulta es por documento o apellido y nombre.  
        - name: document-number
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d*$'
            nullable: true
            example: null
          description: Número de documento de identidad. Enviar vacío si la consulta es por CUIL o apellido y nombre.  
        - name: full-name
          in: query
          required: false
          schema:
            type: string
            nullable: true
            example: null
          description: Apellido y nombre separados por espacios. Debe coincidir exactamente con la base. Enviar vacío si la consulta es por CUIL o documento.  
        - name: gender
          in: query
          required: false
          schema:
            type: string
            nullable: true
            enum: 
              - "M"
              - "F"
            example: "M"
          description: Sexo de la persona. Opcional para búsquedas por DNI o CUIL para descartar duplicados.  

      responses:
        '200':
          description: Evaluación crediticia obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get-retrieve-siisa-response'
              examples:
                200-OK:
                  $ref: '#/components/examples/200-get-retrieve-siisa-response'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          description: Conflicto de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                409-conflict-error:
                  $ref: '#/components/examples/409-get-retrieve-siisa-error'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
        '502':
          $ref: '#/components/responses/badGateway'
        '503':
          $ref: '#/components/responses/serviceUnavailable'
        '504':
          $ref: '#/components/responses/gatewayTimeout'
          
  # ------------------------------------------------------------------
  # GET - Consulta de evaluación crediticia (Bureau Nosis)
  # ------------------------------------------------------------------        
          
  /retrieve/nosis:
    get:
      tags:
        - FP-Credit-Assessment-Information
      summary: Obtiene la evaluación crediticia de una persona por nosis
      description: Consulta el perfil crediticio completo de una persona física en el bureau nosis, incluyendo historial de morosidades, cheques BCRA, scoring y variables sumarizadas.
      operationId: get-retrieve-nosis
      parameters:
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
            format: uuid
            nullable: true
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89ABab][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
            example: "e7c9d173-64c2-4b1b-91f3-8c6d8a8e7d9c"
          description: Identificador único de la transacción (UUIDv4)  
        - name: apikey
          in: header
          required: true
          schema:
            type: string
            example: "abc123def456"
          description: API Key de autenticación del consumidor.
        - name: taxpayer-number
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d*$'
          examples: 
            200-OK: 
              value: "30715190342"
            409-ERR: 
              value: "30715190343"
          description: CUIL/CUIT/CDI de documento
        - name: variable-group-id
          in: query
          required: true
          schema:
            type: string
          examples: 
            200-409:
              value: "VR"
          description: Tipo de variables
        - name: legal-name
          in: query
          required: false
          schema:
            type: string
            nullable: true
            example: null
          description: Razon Social
        - name: gender
          in: query
          required: false
          schema:
            type: string
            nullable: true
            enum: 
              - "M"
              - "F"
            example: "M"
          description: Sexo de la persona. 

      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get-retrieve-nosis-response'
              examples:
                200-OK:
                  $ref: '#/components/examples/200-get-retrieve-nosis-response'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          description: Conflicto de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                409-conflict-error:
                  $ref: '#/components/examples/409-get-retrieve-nosis-error'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServerError'
        '502':
          $ref: '#/components/responses/badGateway'
        '503':
          $ref: '#/components/responses/serviceUnavailable'
        '504':
          $ref: '#/components/responses/gatewayTimeout'      

components:
  schemas:

# ══════════════════════════════════════════════════════════════════════
# RESPONSE PRINCIPAL
# ══════════════════════════════════════════════════════════════════════
    get-retrieve-siisa-response:
      type: object
      properties:
        document-number:
          type: string
          pattern: '^\d*$'
          nullable: true
          example: null
          description: Número de documento de la persona consultada (eco del request).
        taxpayer-number:
          type: string
          pattern: '^(|(20|23|24|25|26|27|30|33|34)\d{9})$'
          nullable: true
          example: null
          description: CUIL de la persona consultada (eco del request).
        full-name:
          type: string
          nullable: true
          example: null
          description: Apellido y nombre de la persona consultada (eco del request).
        is-credit-history-requested:
          type: boolean
          example: true
          description: Indica si se solicitó el historial crediticio BAC (PideBAC).
        is-employment-data-requested:
          type: boolean
          example: true
          description: Indica si se solicitaron los datos laborales BAC (PideDatosLaboral).
        is-valid-user:
          type: boolean
          example: true
          description: Indica si el usuario consultante es válido ante SIISA (UsuarioOK).
        duplicated-parties:
          type: array
          description: Lista de personas duplicadas detectadas en la consulta.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-duplicated-party-data'  
        has-credit-bureau-search:
          type: boolean
          nullable: true
          description: Indica si se consultaron las centrales de crédito (buscaCentrales).
          example: true
        persons:
          type: array
          description: Lista de personas encontradas asociadas a los datos de búsqueda.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-person-data'  
        addresses:
          type: array
          description: Lista de domicilios registrados de la persona.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-address-data'    
        relatives:
          type: array
          description: Lista de familiares registrados de la persona.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-relative-data'
        employers:
          type: array
          description: Lista de empleadores registrados de la persona.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-employer-data'    
        employment-records:
          type: array
          description: Lista de registros laborales detallados de la persona.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-employment-record-data'
        delinquencies:
          type: array
          description: Lista de morosidades vigentes de la persona.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-delinquency-data'
        historical-delinquencies:
          type: array
          description: Lista de morosidades históricas de la persona.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-historical-delinquency-data'
        bcra-delinquencies:
          type: array
          description: Lista de morosidades BCRA vigentes de la persona.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-bcra-delinquency-data'    
        bcra-historical-delinquencies:
          type: array
          description: Lista de morosidades BCRA históricas de la persona.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-bcra-historical-delinquency-data'
        bcra-cheqs:
          type: array
          description: Resumen de cheques rechazados BCRA.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-bcra-cheq-data'   
        bcra-cheq-details:
          type: array
          description: Detalle de cheques rechazados BCRA.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-bcra-cheq-detail-data'    
        inquiries:
          type: array
          description: Contadores de consultas realizadas al bureau en distintos períodos.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-inquiry-data'    
        socio-economic-models:
          type: array
          description: Modelos socioeconómicos calculados (primera instancia, sin montos)
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-socio-economic-model-data'
        insolvency-proceedings:
          type: array
          description: Lista de concursos y quiebras registrados.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-insolvency-proceeding-data'    
        ses-models:
          type: array
          description: Modelos SES con montos de categoría (segunda instancia).
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-ses-model-extended-data'    
        validations:
          type: array
          description: Lista de preguntas de validación de identidad.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-validation-data'    
        credit-activities:
          type: array
          description: Lista de actividades crediticias (OyCs).
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-credit-activity-data' 
        frauds:
          type: array
          description: Lista de alertas de fraude registradas.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-fraud-data'   
        recent-inquirers:
          type: array
          description: Lista de últimas entidades que consultaron al bureau.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-recent-inquirer-data' 
        summarized-variables:
          type: array
          description: Variables sumarizadas del perfil crediticio.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-summarized-variable-data'    
        situation-report:
          type: object
          properties:
            twelve-months:
              type: object
              description: "Conteo de situaciones BCRA en los últimos 12 meses."
              properties:
                level-3-count:
                  type: integer
                  format: int32
                  nullable: true
                  example: null
                  description: Cantidad de meses en situación 3.
                level-4-count:
                  type: integer
                  format: int32
                  nullable: true
                  example: null
                  description: Cantidad de meses en situación 4.
                level-5-count:
                  type: integer
                  format: int32
                  nullable: true
                  example: null
                  description: Cantidad de meses en situación 5.
            six-months:
              type: object
              description: "Conteo de situaciones BCRA en los últimos 6 meses."
              properties:
                level-2-count:
                  type: integer
                  format: int32
                  nullable: true
                  example: null
                  description: Cantidad de meses en situación 2.
                level-3-count:
                  type: integer
                  format: int32
                  nullable: true
                  example: null
                  description: Cantidad de meses en situación 3.
                level-4-count:
                  type: integer
                  format: int32
                  nullable: true
                  example: null
                  description: Cantidad de meses en situación 4.
                level-5-count:
                  type: integer
                  format: int32
                  nullable: true
                  example: null
                  description: Cantidad de meses en situación 5.
            date:
              type: string
              format: date
              nullable: true
              example: null
              description: Fecha del reporte de situaciones (fl — semántica a confirmar con SIISA).
        active-loan:
          type: object
          properties:
            internal-operation:
              $ref: '#/components/schemas/operation-group'
            other-institutions:
              $ref: '#/components/schemas/operation-group'
        canceled-loan:
          type: object
          properties:
            internal-operation:
              $ref: '#/components/schemas/operation-group'
            other-institutions:
              $ref: '#/components/schemas/operation-group'    
        cash-flows:
          type: array
          description: Información de cashflow BAC mensual.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-cash-flow-data'   
        bac-query-number:
          type: object
          properties:
            query-number:
              type: integer
              format: int32
              nullable: true
              example: null
              description: Número identificador de la consulta BAC.
        tax-statuses:
          type: array
          description: Situación tributaria del contribuyente (autónomos y monotributistas).
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-tax-status-data'   
        employments:
          type: array
          description: Segunda instancia de registros laborales (CUIT y razón social).
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-employment-data'    
        arba-lawsuits:
          type: object
          properties: 
            tax-payer-type:
              type: string
              nullable: true
              example: null
              description: Tipo impuesto
            start-date:
              type: string
              format: date
              nullable: true
              example: null
              description: Fecha inicio
            amount:
              type: string
              pattern: '^\d+\.\d+$'
              nullable: true
              example: "0.00"
              description: Importe
        fiscal-risk:
          type: object
          properties: 
            period-start-date:
              type: string
              format: date
              nullable: true
              example: null
              description: Periodo Fecha desde
            period-end-date:
              type: string
              format: date
              nullable: true
              example: null
              description: Periodo Fecha hasta
            occurrence-date:
              type: string
              format: date
              nullable: true
              example: null
              description: Fecha ocurrencia
            province-name:
              type: string
              nullable: true
              example: null
              description: Provincia
        bcra-historical-situations:
          type: array
          description: Situaciones crediticias históricas en el BCRA.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-bcra-historical-situation-data'      
        scorings:
          type: array
          description: Lista de scores crediticios calculados por el bureau.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-scoring-data'
       

# ══════════════════════════════════════════════════════════════════════
# SCORINGS
# ══════════════════════════════════════════════════════════════════════
    get-retrieve-siisa-scoring-data:
      type: object
      properties:
        type:
          type: integer
          format: int32
          nullable: true
          example: null
          description: Tipo de score (campo score del backend SIISA).
        model-code:
          type: string
          nullable: true
          example: null
          description: Código del modelo de scoring utilizado.
        value:
          type: string
          pattern: '^\d*$'
          nullable: true
          example: null
          description: Valor numérico del score.

# ══════════════════════════════════════════════════════════════════════
# PERSONAS Y DUPLICADOS
# ══════════════════════════════════════════════════════════════════════
    get-retrieve-siisa-duplicated-party-data:
      type: object
      properties:
        taxpayer-number:
          type: string
          pattern: '^(|(20|23|24|25|26|27|30|33|34)\d{9})$'
          nullable: true
          example: null
          description: CUIL de la persona duplicada.
        document-type:
          type: string
          nullable: true
          example: null
          description: Nombre del tipo de documento.
        document-number:
          type: string
          pattern: '^\d*$'
          nullable: true
          example: null
          description: Número de documento de identidad.
        full-name:
          type: string
          nullable: true
          example: null
          description: Apellido y nombre completos.
        gender:
          type: string
          nullable: true
          enum: 
            - "M"
            - "F"
          example: "M"
          description: Sexo de la persona.
        birth-date:
          type: string
          format: date
          nullable: true
          example: null
          description: Fecha de nacimiento.

    get-retrieve-siisa-person-data:
      type: object
      properties:
        taxpayer-number:
          type: string
          pattern: '^(|(20|23|24|25|26|27|30|33|34)\d{9})$'
          nullable: true
          example: null
          description: CUIL de la persona.
        document-number:
          type: string
          pattern: '^\d*$'
          nullable: true
          example: null
          description: Número de documento de identidad.
        full-name:
          type: string
          nullable: true
          example: null
          description: Apellido y nombre completos.
        gender:
          type: string
          nullable: true
          enum: 
            - "M"
            - "F"
          example: "M"
          description: Sexo de la persona.
        age:
          type: integer
          format: int32
          nullable: true
          example: null
          description: Edad de la persona en años.
        birth-date:
          type: string
          format: date
          nullable: true
          example: null
          description: Fecha de nacimiento.
        last-name:
          type: string
          nullable: true
          example: null
          description: Apellido de la persona.
        first-name:
          type: string
          nullable: true
          example: null
          description: Nombre de pila de la persona.
        is-deceased:
          type: boolean
          example: false
          description: Indica si la persona está fallecida.


# ══════════════════════════════════════════════════════════════════════
# DOMICILIO Y TELÉFONO
# ══════════════════════════════════════════════════════════════════════
    get-retrieve-siisa-address-data:
      type: object
      properties:
        street-name:
          type: string
          nullable: true
          example: null
          description: Dirección del domicilio.
        town-name:
          type: string
          nullable: true
          example: null
          description: Localidad del domicilio.
        postal-code:
          type: string
          nullable: true
          example: null
          description: Código postal del domicilio.
        province-name:
          type: string
          nullable: true
          example: null
          description: Nombre de la provincia.
        phones:
          type: array
          description: Teléfonos asociados al domicilio.
          items:
            $ref: '#/components/schemas/get-retrieve-siisa-address-phone-data'

    get-retrieve-siisa-address-phone-data:
      type: object
      properties:
        area-code:
          type: string
          pattern: '^\d*$'
          nullable: true
          example: null
          description: Prefijo telefónico.
        number:
          type: string
          pattern: '^\d*$'
          nullable: true
          example: null
          description: Número de teléfono.
# ══════════════════════════════════════════════════════════════════════
# FAMILIARES
# ══════════════════════════════════════════════════════════════════════
    get-retrieve-siisa-relative-data:
      type: object
      properties:
        taxpayer-number:
          type: string
          pattern: '^(|(20|23|24|25|26|27|30|33|34)\d{9})$'
          nullable: true
          example: null
          description: CUIL del familiar.
        document-number:
          type: string
          pattern: '^\d*$'
          nullable: true
          example: null
          description: Número de documento del familiar.
        full-name:
          type: string
          nullable: true
          example: null
          description: Apellido y nombre del familiar.
        gender:
          type: string
          nullable: true
          enum: 
            - "M"
            - "F"
          example: "M"
          description: Sexo de la persona.
        birth-date:
          type: string
          format: date
          nullable: true
          example: null
          description: Fecha de nacimiento del familiar.
        age:
          type: integer
          format: int32
          nullable: true
          example: null
          description: Edad del familiar en años.
# ══════════════════════════════════════════════════════════════════════
# EMPLEADORES
# ══════════════════════════════════════════════════════════════════════
    get-retrieve-siisa-employer-data:
      type: object
      properties:
        individual-taxpayer-number:
          type: string
          pattern: '^(|(20|23|24|25|26|27|30|33|34)\d{9})$'
          nullable: true
          example: null
          description: CUIL del empleador.
        business-taxpayer-number:
          type: string
          pattern: '^(|(20|23|24|25|26|27|30|33|34)\d{9})$'
          nullable: true
          example: null
          description: CUIT del empleador.
        start-date:
          type: string
          format: date
          nullable: true
          example: null
          description: Fecha de ingreso al empleador.
        legal-name:
          type: string
          nullable: true
          example: null
          description: Razón social del empleador.
        street-name:
          type: string
          nullable: true
          example: null
          description: Domicilio del empleador.
        postal-code:
          type: string
          nullable: true
          example: null
          description: Código postal del empleador.
        town-name:
          type: string
          nullable: true
          example: null
          description: Localidad del empleador.
        province-name:
          type: string
          nullable: true
          example: null
          description: Provincia del empleador.

# ══════════════════════════════════════════════════════════════════════
# REGISTROS LABORALES
# ══════════════════════════════════════════════════════════════════════
    get-retrieve-siisa-employment-record-data:
      type: object
      properties:
        taxpayer-number:
          type: string
          pattern: '^(|(20|23|24|25|26|27|30|33|34)\d{9})$'
