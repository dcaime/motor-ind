                  description: Código de la peor situación informada ante la Central de Deudores del BCRA en los últimos 12 meses.
                  example: "4"
                worst-situation-three-months-code:
                  type: string
                  description: Código de la peor situación informada ante la Central de Deudores del BCRA en los últimos 3 meses.
                  example: "4"
            legal-situation:
              type: object
              description: Situación legal del cliente para el modelo X6L.
              additionalProperties: false
              properties:
                has-delinquency-observations:
                  type: boolean
                  description: Indica si posee observaciones de morosidad en entidad no financiera.
                  example: true
                lawsuits:
                  type: object
                  description: Resumen de juicios asociados.
                  additionalProperties: false
                  properties:
                    active-executive-count:
                      type: integer
                      format: int32
                      nullable: true
                      description: Cantidad de juicios ejecutivos activos registrados.
                      example: 1
                    executive-five-years-count:
                      type: integer
                      format: int32
                      nullable: true
                      description: Cantidad de juicios ejecutivos entablados en los últimos 5 años.
                      example: 2
                    ordinary-count:
                      type: integer
                      format: int32
                      nullable: true
                      description: Cantidad de juicios ordinarios en curso.
                      example: 0
                    sixty-months-count:
                      type: integer
                      format: int32
                      nullable: true
                      description: Cantidad de juicios en los últimos 60 meses.
                      example: 2
                bankruptcy:
                  type: object
                  description: Resumen de concursos y quiebras.
                  additionalProperties: false
                  properties:
                    requests-last-year-count:
                      type: integer
                      format: int32
                      nullable: true
                      description: Cantidad de pedidos de quiebra/concurso registrados en el último año.
                      example: 0
                    requests-five-years-count:
                      type: integer
                      format: int32
                      nullable: true
                      description: Cantidad de pedidos de quiebra/concurso registrados en los últimos 5 años.
                      example: 0
                    preventive-count:
                      type: integer
                      format: int32
                      nullable: true
                      description: Cantidad de concursos preventivos solicitados o abiertos.
                      example: 0
                    decreed-count:
                      type: integer
                      format: int32
                      nullable: true
                      description: Cantidad de quiebras decretadas formalmente.
                      example: 0
                    sixty-months-count:
                      type: integer
                      format: int32
                      nullable: true
                      description: Cantidad de quiebras decretadas últimos 60 meses.
