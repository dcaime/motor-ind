    webhooks-veraz-post-request-result-veraz-service-x6l:
      type: object
      description: Respuesta de evaluación crediticia Veraz para el modelo X6L (Reporte Legal y Bureau detallado).
      additionalProperties: false
      required:
        - transaction-id
        - original-transaction-id
        - evaluation
      properties:
        transaction-id:
          type: string
          description: Identificador único de la transacción actual.
          example: "9b187654-0c1a-4d8c-90d3-43c247551234"
        original-transaction-id:
          type: string
          description: Identificador único de la transacción origen.
          example: "9b187654-0c1a-4d8c-90d3-43c247551234"
        evaluation:
          type: object
          description: Detalle de la evaluación crediticia para el modelo X6L.
          additionalProperties: false
          required:
            - status
            - category-code
            - category-details
            - customer
          properties:
            status:
              type: string
              description: Estado del resultado de la evaluación.
              example: "completed"
            category-code:
              type: string
              description: Código de categoría asignado en la evaluación.
              example: "RECHAZAR"
            category-details:
              type: array
              description: Lista de detalles explicativos de la categoría obtenida.
              items:
                type: string
                description: Detalle específico del perfil crediticio.
                example: "Mora legal detectada."
            customer:
              type: object
              description: Información del cliente evaluado en el modelo X6L.
              additionalProperties: false
              properties:
                document-number:
                  type: string
                  description: Número de documento de identidad del cliente.
                  example: "25123456"
                full-name:
                  type: string
                  description: Nombre completo del cliente.
                  example: "GOMEZ, MARIA LAURA"
                gender:
                  type: string
                  description: Género del cliente según registro oficial.
                  enum:
                    - "M"
                    - "F"
                    - "I"
                    - "S"
                    - "X"
                    - "B"
                  example: "F"
                taxpayer-number:
                  type: string

                  pattern: "^(|(20|23|24|25|26|27|30|33|34)\\d{9})$"
                  description: Identificación tributaria (CUIT/CUIL) de 11 dígitos.
                  example: "27251234563"
                addresses:
                  type: array
                  description: Lista de domicilios declarados.
                  items:
                    type: string
                    description: Domicilio completo declarado por el cliente.
                    example: "AV SAN MARTIN 450, MENDOZA"
                type:
                  type: string
                  description: Tipo o categoría de perfil del cliente.
                  example: "Cliente Existente"
                document-version:
                  type: string
                  description: Versión o ejemplar del documento presentado.
                  example: "A"
            credit-cards:
              type: object
              description: Información consolidada de tarjetas de crédito para el modelo X6L.
              additionalProperties: false
              properties:
                oldest-months-count:
                  type: integer
                  format: int32
                  nullable: true
                  description: Antigüedad de la tarjeta de crédito más antigua expresada en meses.
                  example: 36
                active-maximum-limit-amount:
                  type: string
                  pattern: "^\\d+\\.\\d+$"
                  description: Monto máximo del límite activo otorgado entre sus tarjetas de crédito.
                  example: "500000.00"
                has-normal-status-last-twelve-months:
                  type: boolean
                  description: Indica si mantuvo situación normal en los últimos 12 meses en tarjetas de crédito.
                  example: false
                has-financed-balance-limit-ratio:
                  type: boolean
                  description: Indica si posee relación entre saldo financiado y límite según el parámetro definido.
                  example: true
                has-peerbank-active:
                  type: boolean
                  description: Indica si posee tarjetas activas en entidades pares/competidoras.
                  example: true
                exigible-amount:
                  type: string
                  pattern: "^\\d+\\.\\d+$"
                  description: Monto total exigible en tarjetas de crédito.
                  example: "45000.00"
                competitor-maximum-limit-amount:
                  type: string
                  pattern: "^\\d+\\.\\d+$"
                  description: Monto máximo del límite otorgado por entidades competidoras en tarjetas.
                  example: "250000.00"
                competitor-minimum-payment-amount:
                  type: string
                  pattern: "^\\d+\\.\\d+$"
                  description: Monto del pago mínimo requerido por competidores en tarjetas.
                  example: "12000.00"
            current-accounts:
              type: object
              description: Información consolidada de cuentas corrientes para el modelo X6L.
              additionalProperties: false
              properties:
                oldest-months-count:
                  type: integer
                  format: int32
                  nullable: true
                  description: Antigüedad de la cuenta corriente más antigua en meses.
                  example: 24
                has-worst-status-twelve-months:
                  type: boolean
                  description: Indica si registró la peor situación o condición de irregularidad en los últimos 12 meses.
                  example: true
                is-average-usage-under-limit:
                  type: boolean
                  description: Indica si el uso promedio de la cuenta corriente se encuentra por debajo del límite autorizado.
                  example: false
                average-balance-amount:
                  type: string
                  pattern: "^\\d+\\.\\d+$"
                  description: Monto del saldo promedio general histórico en cuentas corrientes.
                  example: "87000.00"
            loans:
              type: object
              description: Información consolidada de préstamos para el modelo X6L.
              additionalProperties: false
              properties:
                refinanced-count:
                  type: integer
                  format: int32
                  nullable: true
                  description: Cantidad total de préstamos que registran un proceso de refinanciación.
                  example: 1
                unsecured:
                  type: object
                  description: Detalle de préstamos personales / a sola firma.
                  additionalProperties: false
                  properties:
                    exigible-amount:
                      type: string
                      pattern: "^\\d+\\.\\d+$"
                      description: Monto exigible al cobro para préstamos a sola firma.
                      example: "25000.00"
                pledge:
                  type: object
                  description: Detalle de préstamos prendarios.
                  additionalProperties: false
                  properties:
                    exigible-amount:
                      type: string
                      pattern: "^\\d+\\.\\d+$"
                      description: Monto exigible actual en préstamos prendarios.
                      example: "10000.00"
                mortgage:
                  type: object
                  description: Detalle de préstamos hipotecarios.
                  additionalProperties: false
                  properties:
                    exigible-amount:
                      type: string
                      pattern: "^\\d+\\.\\d+$"
                      description: Monto exigible al cobro en préstamos hipotecarios.
                      example: "0.00"
            bureau:
              type: object
              description: Información reportada por el bureau de crédito para el modelo X6L.
              additionalProperties: false
              properties:
                worst-status-code:
                  type: string
                  description: Código del peor estado informado por el bureau de crédito.
                  example: "4"
            bcra:
              type: object
              description: Información reportada por el BCRA para el modelo X6L.
              additionalProperties: false
              properties:
                worst-situation-twelve-months-code:
