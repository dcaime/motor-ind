                valid-date-to:
                  type: string
                  format: date
                  nullable: true
                  example: null
                  description: Fecha de vencimiento del certificado PyME.
                issuance-date:
                  type: string
                  format: date
                  nullable: true
                  example: null
                  description: Fecha de emisión del certificado PyME.
                registration-number:
                  type: integer
                  format: int32
                  nullable: true
                  example: null
                  description: Número de registro del certificado PyME.
                sector:
                  type: object
                  properties:
                    code:
                      type: integer
                      format: int32
                      nullable: true
                      example: null
