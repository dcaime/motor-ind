                    description:
                      type: string
                      nullable: true
                      example: null
                      description: Descripción asociada al código del sector de actividad.
                transaction-type-code:
                  type: integer
                  format: int32
                  nullable: true
                  example: null
                  description: Número de transacción asociado al certificado PyME.
              required:
                 - category-code
                 - valid-date-from
                 - valid-date-to
                 - issuance-date
                 - registration-number
                 - sector
