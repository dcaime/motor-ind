openapi: 3.0.0
info:
  title: Macro OAuth
  description: Macro OAuth
  version: 1.0.00
servers:
- url: /v1/oauth
# Apply the security globally to all operations
security:
  - basicAuth: []

tags:
  - name: macro-jwt 
    description: Informacion sobre OAuth de Macro para obtener jwt de acceso.

paths:
  /access:
    post:
      tags:
        - macro-jwt
      summary: Obtener access jwt para consumir apis
      description: Obtener access jwt para consumir apis
      operationId: jwt
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
                - scope
              properties:
                grant_type:
                  description: El valor ***DEBE*** ser "client_credentials"
                  type: string
                  enum:
                    - client_credentials
                  example: client_credentials
                scope:
                  description: El valor ***DEBE*** ser "openid"
                  type: string
                  enum:
                    - openid
                  example: openid
                  
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/token-response' 
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401': 
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500': 
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'

components:
  schemas:
    token-response:
      type: object
      properties:
        access_token:
          description: El access token generado por el authorization server
          type: string
          example: ""
        token_type:
          description: Tipo de token generado
          type: string
          example: Bearer
        expires_in:
          description: Tiempo de vida del access token
          type: integer
          example: 360
        scope:
          description: Scope requerido por el cliente
          type: string
          example: 'openid'
      
    #----------------------------------------------------------------------------------------------
    # ERROR
    #----------------------------------------------------------------------------------------------    
    error: 
      type: object
      properties:
        Code:
          type: string
        Id:
          type: string
        Message:
          type: string
        Errors:
          type: array
          items:
            $ref: '#/components/schemas/errors'
          
    errors:
      type: object
      properties:
        ErrorCode:
          type: string
        Message:
          type: string
        Path:
          type: string

  securitySchemes:
    basicAuth:            # arbitrary name for the security scheme
      type: http
      scheme: basic